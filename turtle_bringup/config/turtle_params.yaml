# Parameters of the goToPose server. Edit, rebuild (or use --symlink-install) and relaunch.
# They can also be changed while running:
#   ros2 param set /goto_pose_server max_linear_speed 1.0
#   ros2 service call /set_speed_limits turtle_interfaces/srv/SetSpeedLimits "{max_linear_speed: 1.0, max_angular_speed: 1.5}"
goto_pose_server:
  ros__parameters:
    max_linear_speed: 2.0      # units/s, must be > 0
    max_angular_speed: 2.0     # rad/s, must be > 0
    position_tolerance: 0.05   # units
    angle_tolerance: 0.02      # rad
